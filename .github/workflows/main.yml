name: Sync Lua Files to edopro_cards_bigmen

on:
  push:
    branches:
      - dev

jobs:
  sync-lua:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get list of changed and deleted .lua files
        id: changed-lua
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.lua$' || true)
          DELETED_FILES=$(git diff --diff-filter=D --name-only HEAD~1 HEAD | grep '\.lua$' || true)
          echo "Changed Lua files:"
          echo "$FILES"
          echo "Deleted Lua files:"
          echo "$DELETED_FILES"
          printf "files<<EOF\n%s\nEOF\n" "$FILES" >> $GITHUB_ENV
          printf "deleted_files<<EOF\n%s\nEOF\n" "$DELETED_FILES" >> $GITHUB_ENV

      - name: Clone edopro_cards_bigmen repository
        if: env.files != ''
        run: |
          git clone https://x-access-token:${{ secrets.EDOPRO_REPO_TOKEN }}@github.com/franluque2/edopro_cards_bigmen.git target_repo

      - name: Copy over Lua files
        if: env.files != ''
        run: |
          for file in $files; do
            if [ -f target_repo/$file ]; then
              cp "$file" "target_repo/$file"
            fi
          done

      - name: Remove deleted Lua files
        if: env.deleted_files != ''
        run: |
          for file in $deleted_files; do
            if [ -f target_repo/$file ]; then
              echo "Removing deleted Lua file: $file"
              git rm "target_repo/$file"
            fi
          done

      - name: Commit and push changes to edopro_cards_bigmen
        if: env.files != '' || env.deleted_files != ''
        run: |
          cd target_repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Card Scripts"
            git push https://x-access-token:${{ secrets.EDOPRO_REPO_TOKEN }}@github.com/franluque2/edopro_cards_bigmen.git HEAD:main
          fi
